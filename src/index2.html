<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>油耗计算器 - 大鹏制作</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif;}
body{padding:12px;background:#fff;font-size:14px;}
.header{background:#d49000;color:#fff;text-align:center;padding:12px;border-radius:4px;margin-bottom:10px;}
.header h1{font-size:24px;display:inline-block;}
.header p{font-size:16px;display:inline-block;margin-left:8px;}
.car-select-row{display:grid;grid-template-columns:1fr;gap:8px;margin-bottom:8px;}
.car-select-row label{font-weight:bold;display:block;margin-bottom:3px;}
.car-select-row select{width:100%;padding:10px;font-size:16px;border:1px solid #aaa;border-radius:4px;-webkit-appearance:none;appearance:none;}
.input-row{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;margin-bottom:8px;}
.input-cell{text-align:center;}
.input-cell label{display:block;background:#dd3333;color:#fff;padding:6px 2px;font-weight:bold;border-radius:3px;}
.input-cell input{width:100%;padding:8px;font-size:15px;border:1px solid #bbb;border-radius:3px;}
.result-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:14px;}
.res-cell{text-align:center;padding:10px;color:#fff;font-weight:bold;font-size:16px;border-radius:3px;}
.c1{background:#28a745;}
.c2{background:#ffcc00;color:#222;}
.c3{background:#2266dd;}
.btn-group{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:12px;}
button{padding:9px 12px;font-size:14px;border:none;border-radius:4px;color:#fff;cursor:pointer;}
.btn-save{background:#28a745;}
.btn-excel{background:#ffc107;color:#222;}
.btn-txt{background:#ff9800;}
.btn-json{background:#2266dd;}
.btn-in{background:#9944bb;}
.btn-clear{background:#dd3333;}
.btn-del-car{background:#666;}
.total-bar{background:#eee;padding:10px;text-align:center;border-radius:4px;margin-bottom:12px;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{border:1px solid #ccc;padding:6px;text-align:center;}
th{background:#f0f0f0;}
.del-btn{background:#dd3333 !important;color:#fff;border:none;padding:4px 8px;font-size:13px;border-radius:3px;cursor:pointer;}
.note{margin-top:8px;font-size:12px;color:#555;line-height:1.4;}
</style>
</head>
<body>
<div class="header">
<h1>油耗计算器</h1><p>大鹏制作</p>
</div>
<div class="car-select-row">
<label>选择车辆</label>
<select id="carSelect"></select>
</div>
<div class="input-row">
<div class="input-cell">
<label>加油金额 (元)</label>
<input type="number" id="money" placeholder="输入金额" oninput="calc()">
</div>
<div class="input-cell">
<label>加油单价 (元)</label>
<input type="number" id="price" placeholder="油价" oninput="calc()">
</div>
<div class="input-cell">
<label>行驶里程 (公里)</label>
<input type="number" id="km" placeholder="本次里程" oninput="calc()">
</div>
<div class="input-cell">
<label>加油量 (升)</label>
<input type="text" id="liter" readonly value="--">
</div>
</div>
<div class="result-row">
<div class="res-cell c1">元/公里<br><span id="costPerKm">--</span></div>
<div class="res-cell c2">升/公里<br><span id="lPerKm">--</span></div>
<div class="res-cell c3">升/百公里<br><span id="l100">--</span></div>
</div>
<div class="btn-group">
<button class="btn-save" onclick="saveRecord()">保存本条记录</button>
<button class="btn-excel" onclick="exportExcel()">导出Excel</button>
<button class="btn-txt" onclick="exportTxt()">导出TXT</button>
<button class="btn-json" onclick="exportJson()">导出备份(JSON)</button>
<button class="btn-in" onclick="importJson()">导入备份</button>
<button class="btn-clear" onclick="clearCurrentCar()">清空当前车辆记录</button>
<button class="btn-del-car" onclick="deleteCar()">删除当前车辆</button>
</div>
<div class="total-bar">
汇总统计｜总里程：<span id="sumKm">0.0</span> km｜总油量：<span id="sumLiter">0.00</span> L｜平均油耗：<span id="avgOil">0.00</span> L/100km
</div>
<div>
<h3 style="margin:8px 0;">加油记录汇总</h3>
<table>
<thead>
<tr>
<th>车辆号码</th>
<th>记录日期</th>
<th>加油金额(元)</th>
<th>加油单价(元)</th>
<th>行驶里程(km)</th>
<th>加油量(L)</th>
<th>元/公里</th>
<th>升/公里</th>
<th>升/百公里</th>
<th>操作</th>
</tr>
</thead>
<tbody id="tableBody"></tbody>
</table>
</div>
<div class="note">
注: 只需输入红色部分内容即可。电脑手机独立记录，需要使用json文件迁移数据。
</div>
<script>
const KEY_CAR_LIST = "oilCarList";
const KEY_RECORDS = "oilRecords";
function getCarList(){let s=localStorage.getItem(KEY_CAR_LIST);return s?JSON.parse(s):[];}
function saveCarList(cars){localStorage.setItem(KEY_CAR_LIST,JSON.stringify(cars));}
function getRecords(){let s=localStorage.getItem(KEY_RECORDS);return s?JSON.parse(s):[];}
function saveRecords(list){localStorage.setItem(KEY_RECORDS,JSON.stringify(list));}
function addNewCar(){
  let newCar=window.prompt("请输入新增车辆车牌号码：");
  if(newCar===null||newCar.trim()=="")return;
  newCar=newCar.trim();
  let cars=getCarList();
  if(cars.includes(newCar)){alert("该车辆已经存在");document.getElementById('carSelect').value=newCar;render();return;}
  cars.push(newCar);saveCarList(cars);fillCarSelect();document.getElementById('carSelect').value=newCar;render();
}
function fillCarSelect(){
  let select=document.getElementById('carSelect');
  let oldVal=select.value;
  let cars=getCarList();
  select.innerHTML="";
  let addOpt=document.createElement('option');addOpt.value="__ADD__";addOpt.innerText="+ 新增车辆";select.appendChild(addOpt);
  cars.forEach(car=>{let opt=document.createElement('option');opt.value=car;opt.innerText=car;select.appendChild(opt);});
  if(cars.includes(oldVal))select.value=oldVal;else if(cars.length>0)select.value=cars[0];else select.value="__ADD__";
}
function calc(){
  let money=Number(document.getElementById('money').value);
  let price=Number(document.getElementById('price').value);
  let km=Number(document.getElementById('km').value);
  if(!money||!price||!km){
    document.getElementById('liter').value="--";
    document.getElementById('costPerKm').innerText="--";
    document.getElementById('lPerKm').innerText="--";
    document.getElementById('l100').innerText="--";
    return null;
  }
  let liter=money/price;
  let lPerKm=liter/km;
  let l100=lPerKm*100;
  let costPerKm=money/km;
  document.getElementById('liter').value=liter.toFixed(2);
  document.getElementById('costPerKm').innerText=costPerKm.toFixed(2);
  document.getElementById('lPerKm').innerText=lPerKm.toFixed(4);
  document.getElementById('l100').innerText=l100.toFixed(2);
  return {liter,costPerKm,lPerKm,l100};
}
function saveRecord(){
  let select=document.getElementById('carSelect');
  let carNo=select.value;
  if(carNo==="__ADD__"){alert("请先下拉选择车辆，+新增车辆用来添加新车");return;}
  let money=Number(document.getElementById('money').value);
  let price=Number(document.getElementById('price').value);
  let km=Number(document.getElementById('km').value);
  let res=calc();
  if(!res){alert("请填写：加油金额、油价、行驶里程");return;}
  let item={carNo:carNo,time:new Date().toLocaleString(),money:money,price:price,km:km,liter:res.liter.toFixed(2),costPerKm:res.costPerKm.toFixed(2),lPerKm:res.lPerKm.toFixed(4),l100:res.l100.toFixed(2)};
  let list=getRecords();list.unshift(item);saveRecords(list);fillCarSelect();document.getElementById('carSelect').value=carNo;render();
  document.getElementById('money').value="";document.getElementById('price').value="";document.getElementById('km').value="";
  document.getElementById('liter').value="--";document.getElementById('costPerKm').innerText="--";document.getElementById('lPerKm').innerText="--";document.getElementById('l100').innerText="--";
}
function render(){
  fillCarSelect();
  let list=getRecords();
  let selectedCar=document.getElementById('carSelect').value;
  if(selectedCar==="__ADD__"){document.getElementById('tableBody').innerHTML="";document.getElementById('sumKm').innerText="0.0";document.getElementById('sumLiter').innerText="0.00";document.getElementById('avgOil').innerText="0.00";return;}
  let filterList=list.filter(i=>i.carNo===selectedCar);
  let tbody=document.getElementById('tableBody');let html="";let sumKm=0,sumLiter=0;
  filterList.forEach(v=>{
    sumKm+=Number(v.km);sumLiter+=Number(v.liter);
    let t=v.time.split(' ');
    html+=`<tr><td>${v.carNo}</td><td>${t[0]}<br>${t[1]}</td><td>${v.money}</td><td>${v.price}</td><td>${v.km}</td><td>${v.liter}</td><td>${v.costPerKm}</td><td>${v.lPerKm}</td><td>${v.l100}</td><td><button class="del-btn" onclick="del(${list.indexOf(v)})">删除</button></td></tr>`;
  });
  tbody.innerHTML=html;
  let avgOil=sumKm>0?(sumLiter/sumKm*100).toFixed(2):"0.00";
  document.getElementById('sumKm').innerText=sumKm.toFixed(1);document.getElementById('sumLiter').innerText=sumLiter.toFixed(2);document.getElementById('avgOil').innerText=avgOil;
}
function del(idx){let list=getRecords();list.splice(idx,1);saveRecords(list);render();}
function clearCurrentCar(){
  let sel=document.getElementById('carSelect').value;
  if(sel==="__ADD__")return;
  if(!confirm(`确定清空【${sel}】所有加油记录？不可恢复！`))return;
  let list=getRecords().filter(i=>i.carNo!==sel);saveRecords(list);render();
}
function deleteCar(){
  let sel=document.getElementById('carSelect').value;
  if(sel==="__ADD__")return;
  if(!confirm(`确定删除车辆【${sel}】以及它所有加油记录？`))return;
  let cars=getCarList().filter(c=>c!==sel);saveCarList(cars);
  let rec=getRecords().filter(r=>r.carNo!==sel);saveRecords(rec);render();
}
function exportExcel(){
  let list=getRecords();let sel=document.getElementById('carSelect').value;if(sel==="__ADD__")return;
  let f=list.filter(i=>i.carNo===sel);
  let csv="车牌,记录日期,加油金额(元),加油单价(元),行驶里程(km),加油量(L),元/公里,升/公里,升/百公里\n";
  f.forEach(v=>csv+=`${v.carNo},${v.time},${v.money},${v.price},${v.km},${v.liter},${v.costPerKm},${v.lPerKm},${v.l100}\n`);
  downloadFile(csv,`${sel}_油耗记录.csv`,"text/csv");
}
function exportTxt(){
  let list=getRecords();let sel=document.getElementById('carSelect').value;if(sel==="__ADD__")return;
  let f=list.filter(i=>i.carNo===sel);
  let txt=`${sel} 油耗记录\n`;
  f.forEach(v=>txt+=`${v.time} | ${v.money}元 | ${v.price}元/L | ${v.km}km | ${v.liter}L | ${v.l100} L/100km\n`);
  downloadFile(txt,`${sel}_油耗记录.txt`,"text/plain");
}
function exportJson(){
  let data={cars:getCarList(),records:getRecords()};
  let json=JSON.stringify(data,null,2);
  downloadFile(json,"油耗全部备份.json","application/json");
}
function importJson(){
  let input=document.createElement('input');input.type='file';input.accept='.json';
  input.onchange=e=>{
    let f=e.target.files[0];let reader=new FileReader();
    reader.onload=evt=>{
      try{
        let d=JSON.parse(evt.target.result);
        if(d.cars&&d.records){saveCarList(d.cars);saveRecords(d.records);}else{alert("备份格式不兼容");return;}
        render();alert("导入成功！");
      }catch(err){alert("文件解析失败，请选择正确的json备份文件");}
    };
    reader.readAsText(f);
  };
  input.click();
}
function downloadFile(content,filename,type){
  if(window.plus){
    let blob=new Blob([content],{type:type});
    let path=plus.io.convertLocalFileSystemURL('_downloads/'+filename);
    plus.io.resolveLocalFileSystemURL('_downloads',function(entry){
      entry.getFile(filename,{create:true},function(fileEntry){
        fileEntry.createWriter(function(writer){
          writer.write(blob);
          writer.onwriteend=function(){plus.nativeUI.toast("文件已保存到下载目录");};
        });
      });
    });
  }else{
    let blob=new Blob([content],{type:type});
    let url=URL.createObjectURL(blob);
    let a=document.createElement('a');a.href=url;a.download=filename;a.click();URL.revokeObjectURL(url);
  }
}
document.getElementById('carSelect').onchange=function(){let v=this.value;if(v==="__ADD__")addNewCar();else render();};
document.getElementById('carSelect').onclick=function(){if(this.value==="__ADD__")setTimeout(()=>addNewCar(),50);};
if(window.plus){
  plus.globalEvent.addEventListener('plusready',function(){render();});
}else{
  render();
}
</script>
</body>
</html>
